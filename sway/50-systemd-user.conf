# sway does not set WAYLAND_DISPLAY in the systemd user environment
# See FS#63021
# Adapted from xorg's 50-systemd-user.sh, which achieves a similar goal.

# Upstream refuses to set XDG_CURRENT_DESKTOP so we have to: the
# xdg-desktop-portal lookup (portals.conf(5)) selects sway-portals.conf
# from this value. No DISPLAY here on purpose: X11-specific.
exec systemctl --user set-environment XDG_CURRENT_DESKTOP=sway
exec systemctl --user import-environment SWAYSOCK \
                                         WAYLAND_DISPLAY \
                                         XDG_CURRENT_DESKTOP

exec hash dbus-update-activation-environment 2>/dev/null && \
     dbus-update-activation-environment --systemd SWAYSOCK \
                                                  WAYLAND_DISPLAY \
                                                  XDG_CURRENT_DESKTOP=sway
